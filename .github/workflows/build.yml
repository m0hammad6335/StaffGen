name: Build
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode package
      - uses: actions/upload-artifact@v4
        with:
          name: StaffGen
          path: target/StaffGen-*.jar
