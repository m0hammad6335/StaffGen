plugins { id 'java' }

group = 'ir.devwebs'
version = '1.0-beta'

repositories {
    mavenCentral()
    maven { url = uri('https://hub.spigotmc.org/nexus/repository/snapshots/') }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}
